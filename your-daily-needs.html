<body>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .login-pg img {
            height: 726px;
            width: 100%;
            position: relative;
        }

        .login h1 {
            font: 30px Quicksand, sans-serif;
            position: absolute;
            top: 200px;
            left: 350px;
            color: #253D4E;
        }

        .login p {
            color: #7E7E7E;
            position: absolute;
            top: 235px;
            left: 370px;
            font-size: medium;
            font: 12px Quicksand, sans-serif;
        }



        .login .create {
            color: #3BB77E;
            font-size: large;
            font: 20px Quicksand, sans-serif;


        }

        .login input {
            width: 20%;
            border: 1px solid rgb(204, 203, 203);
            height: 40px;
            border-radius: 8px;
            text-align: center;
            position: absolute;
            left: 350px;
            top: 265px;

        }

        .login .passwd input {
            width: 20%;
            border: 1px solid rgb(204, 203, 203);
            height: 40px;
            border-radius: 8px;
            text-align: center;
            position: absolute;
            left: 350px;
            top: 313px;

        }

        .login .forget {
            color: red;
            position: absolute;
            left: 505px;
            top: 360px;
            font-size: small;
            font-weight: 100;
            font: 15px Quicksand, sans-serif;
        }

        .login .sign {
            color: red;
            position: absolute;
            left: 605px;
            top: 378px;
            font-size: small;
            font-weight: 100;
            font: 15px Quicksand, sans-serif;
        }

        .login button  {
            width: 20%;
            height: 40px;
            color: white;
            background-color: rgb(18, 69, 200);
            position: absolute;
            top: 420px;
            left: 350px;
            border: none;
            border-radius: 15px;
            font-size: larger;
            text-decoration: none;
            text-align: center;
        }
        .login a{
            color: white;
            text-decoration: none;
        }

        .login .login-with {
            color: red;
            position: absolute;
            top: 470px;
            left: 465px;
            font-size: large;
            font-weight: 300;
        }

        .icons {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;

        }

        .facebook {
            color: white;
            background-color: rgb(55, 55, 211);
            width: 3%;
            padding: 5px 5px;
            text-align: center;
            border-radius: 10px;
            height: 20px;
            position: absolute;
            top: 500px;
            left: 430px;

        }

        .google {
            color: white;
            background-color: red;
            width: 3%;
            padding: 5px 5px;
            text-align: center;
            border-radius: 10px;
            height: 20px;
            position: absolute;
            top: 500px;
            left: 495px;
        }

        .twitter {
            color: white;
            background-color: skyblue;
            width: 3%;
            padding: 5px 5px;
            text-align: center;
            border-radius: 10px;
            height: 20px;
            position: absolute;
            top: 500px;
            left: 560px;
        }

        .username .right i {
            color: white;
            background-color: rgb(95, 155, 95);
            position: absolute;
            top: 278px;
            left: 610px;
            z-index: 30;
            height: 15px;
            width: 15px;
            border-radius: 50%;
            font-size: 11px;
            text-align: center;
            align-items: center;
          
        }

        .username i{
            color: grey;
            position:absolute ;
            top: 278px;
            left: 510px;
        }
    </style>



    <div class="login-pg">
        <img src="./loginbg.8aa6b5b06f07df673fe0.jpg">


        <div class="login">
            <h1>Login</h1>
            <p>Don't have an account? <span class="create">Create Account</span></p>
            <div class="username">

                 <i class="fa-utility-fill fa-semibold fa-user"></i>
               
                <input type="text" placeholder="enter username:">
                <span class="right"><i class="fas fa-check"></i></span>
                

            </div>



            <div class="passwd">
                <i class="fa-utility-fill fa-semibold fa-lock"></i>
                <input type="text" placeholder="Password:">
                <i class="fa-solid fa-eye-slash"></i>

            </div>

            <p class="forget">Forget your password?</p>
            <p class="sign">Sign up</p>

            <button><a href="./prac2.html">Login</a></button>

            <p class="login-with">Login With</p>

            <div class="icons">
                <div class="facebook">
                    <i class="fa-brands fa-facebook"></i>
                </div>
                <div class="google">
                    <i class="fa-brands fa-google-plus-g"></i>
                </div>
                <div class="twitter">
                    <i class="fa-brands fa-twitter"></i>
                </div>
            </div>








        </div>
    </div>
